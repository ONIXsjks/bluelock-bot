<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Blue Lock Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>⚽ BLUE LOCK</h1>
            <div class="hud">
                <span class="score" id="score">0 - 0</span>
                <span class="timer" id="timer">00:00</span>
            </div>
        </header>

        <div id="game-container">
            <div class="sky"></div>
            <div class="field" id="field">
                <div class="goal-enemy">
                    <div class="goal-net"></div>
                    <div class="goalkeeper">🧤</div>
                </div>
                <div class="enemy-player" id="enemy-player">🎭</div>
                <div class="ball" id="ball">⚽</div>
                <div class="my-player" id="my-player">🎭</div>
            </div>
        </div>

        <div class="controls">
            <div class="move-row">
                <button class="btn-move" onclick="move('up')">⬆️</button>
                <button class="btn-move" onclick="move('down')">⬇️</button>
                <button class="btn-move" onclick="move('left')">⬅️</button>
                <button class="btn-move" onclick="move('right')">➡️</button>
            </div>
            <div class="action-row">
                <button class="btn-action btn-shoot" onclick="shoot()">⚽ شوت</button>
                <button class="btn-action btn-dribble" onclick="dribble()">💨 دریبل</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
