<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Lock</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>⚽ BLUE LOCK</h1>
            <p id="user-name"></p>
        </header>

        <div id="char-select" class="screen active">
            <h2>کاراکترت رو انتخاب کن</h2>
            <div class="chars-grid" id="chars-grid"></div>
        </div>

        <div id="menu" class="screen">
            <h2>منوی بازی</h2>
            <button onclick="play1v1()">⚔️ بازی ۱v۱</button>
            <button onclick="play2v2()">⚽ بازی ۲v۲</button>
            <button onclick="showCard()">📊 کارت بازیکن</button>
            <button onclick="changeChar()">🔄 تغییر کاراکتر</button>
        </div>

        <div id="result" class="screen">
            <h2>نتیجه</h2>
            <pre id="result-text"></pre>
            <button onclick="backToMenu()">بازگشت</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
